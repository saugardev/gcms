name: Deploy GCMS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gcms-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.url.outputs.app_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check deployment scripts
        run: bash -n deploy/jio.sh deploy/runtime.sh deploy/check.sh
      - name: Install Jio
        run: |
          curl -fsSL https://github.com/jiovannish/client/releases/download/v0.3.1/install.sh -o "$RUNNER_TEMP/install-jio.sh"
          JIO_INSTALL_DIR="$RUNNER_TEMP/bin" sh "$RUNNER_TEMP/install-jio.sh"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Deploy and verify
        id: deploy
        env:
          JIO_STATE_DIR: ${{ runner.temp }}/jio
          JIO_API_KEY: ${{ secrets.JIO_API_KEY }}
          JIO_SSH_KEY: ${{ secrets.JIO_SSH_KEY }}
          JIO_VM_ID: ${{ vars.JIO_VM_ID }}
          JIO_ENDPOINT: ${{ vars.JIO_ENDPOINT }}
          GIT_REF: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          umask 077
          [[ -n "$JIO_API_KEY" && -n "$JIO_SSH_KEY" && "$JIO_VM_ID" =~ ^[0-9a-f]{32}$ ]] || { echo 'Configure JIO_API_KEY, JIO_SSH_KEY and JIO_VM_ID'; exit 1; }
          [[ -n "$JIO_ENDPOINT" ]] || unset JIO_ENDPOINT
          session="$JIO_STATE_DIR/sessions/$JIO_VM_ID"
          install -d -m 700 "$JIO_STATE_DIR" "$JIO_STATE_DIR/sessions" "$session"
          printf '%s\n' "$JIO_SSH_KEY" > "$session/id_ed25519"
          ssh-keygen -y -f "$session/id_ed25519" > "$session/id_ed25519.pub"
          printf 'large\n' > "$session/requested-size"
          unset JIO_SSH_KEY
          bash deploy/jio.sh
      - name: Publish app URL and deployment status
        id: url
        if: always()
        env:
          JIO_STATE_DIR: ${{ runner.temp }}/jio
          JIO_API_KEY: ${{ secrets.JIO_API_KEY }}
          JIO_VM_ID: ${{ vars.JIO_VM_ID }}
          JIO_ENDPOINT: ${{ vars.JIO_ENDPOINT }}
          DEPLOY_STATUS: ${{ steps.deploy.outcome }}
        run: |
          [[ -n "$JIO_ENDPOINT" ]] || unset JIO_ENDPOINT
          url="$(jio ports "$JIO_VM_ID" | awk '$1 == 8000 { print $3; exit }')"
          [[ "$url" =~ ^https://[a-zA-Z0-9.-]+(:[0-9]+)?$ ]] || { echo 'No app URL has been allocated yet' >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          printf 'app_url=%s\n' "$url" >> "$GITHUB_OUTPUT"
          printf '[Open GCMS](%s)\n\nDeployment checks: **%s**.\n' "$url" "$DEPLOY_STATUS" | tee -a "$GITHUB_STEP_SUMMARY"
