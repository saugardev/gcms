services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: mafer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: mafer
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mafer -d mafer"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
