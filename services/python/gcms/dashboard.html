<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mafer · GC-MS dashboard</title>
<style>
:root{color-scheme:light;--ink:#1d343b;--muted:#526970;--accent:#087e8b;--surface:#fff;--border:#738983;--soft:#edf5f3;--space:8px}
*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column;background:var(--soft);color:var(--ink);font:14px/1.5 system-ui,sans-serif}
header{background:var(--surface);padding:16px 24px;border-bottom:1px solid var(--border)}h1{font-size:18px;margin:0}p{margin:0;color:var(--muted)}
.topline,form{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.topline{justify-content:space-between;margin-bottom:12px}a{color:var(--accent)}
.sample-action{display:flex;align-items:center;gap:12px;flex-wrap:wrap}#processing-time{font-size:12px;color:var(--muted)}
label{font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px}input,select,button{font:inherit;color:inherit;max-width:100%}
input[type=file]{width:240px}input::file-selector-button,select,button{min-height:40px;padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface)}
button{cursor:pointer}button.primary{background:var(--accent);color:var(--surface);border-color:var(--accent)}button:disabled{cursor:default;opacity:.5}
:focus-visible{outline:3px solid #b95739;outline-offset:3px}[hidden]{display:none!important}#feedback{padding:8px 24px;background:var(--surface);display:flex;align-items:center;gap:12px}#error{color:#865719}
main{flex:1;min-height:0;position:relative}iframe{width:100%;height:100%;border:0;display:block}#loading{position:absolute;inset:0;background:var(--soft);padding:32px;overflow:hidden}
.skeleton{max-width:1200px;margin:24px auto;height:65vh;background:repeating-linear-gradient(to bottom,var(--surface) 0,var(--surface) 48px,var(--soft) 48px,var(--soft) 56px);border-radius:8px}
@media(max-width:640px){header{padding:12px}.topline{gap:8px}form{gap:8px}label.file{width:100%;justify-content:space-between}#feedback{padding:8px 12px}#loading{padding:16px}}
</style>
<header>
  <div class="topline"><h1>Mafer <span style="font-weight:400">/ GC-MS dashboard</span></h1><a href="/docs" target="_blank" rel="noopener">API documentation</a></div>
  <form id="analysis-form">
    <label class="file">Sample ZIP <input id="sample-file" type="file" accept=".zip,application/zip" aria-describedby="upload-help"></label>
    <label>Engine <select id="engine"><option value="rust">Rust</option><option value="python">Python</option></select></label>
    <label style="min-height:40px"><input id="review" type="checkbox" checked> Check stability</label>
    <button class="primary" type="submit">Analyze ZIP</button><div class="sample-action"><button id="load-sample" type="button">Load configured sample</button><span id="processing-time" role="status" aria-live="polite"></span></div>
  </form>
  <p id="upload-help">ZIP containing one complete .D acquisition · maximum 64 MiB</p>
</header>
<div id="feedback"><p id="status" role="status" aria-live="polite">Loading configured sample…</p><p id="error" role="alert" hidden></p><button id="retry" type="button" hidden>Retry</button></div>
<main aria-label="Analysis results">
  <iframe id="report" title="Component dashboard" hidden></iframe>
  <div id="loading" aria-hidden="true"><div class="skeleton"></div></div>
</main>
<noscript>Enable JavaScript to use the dashboard. The API can also return standalone HTML reports.</noscript>
<script>
const form = document.getElementById('analysis-form');
const frame = document.getElementById('report');
const status = document.getElementById('status');
const error = document.getElementById('error');
const retry = document.getElementById('retry');
const processingTime = document.getElementById('processing-time');
let lastFile = null, busy = false, reportUrl = '';
async function load(file = null) {
  if (busy) return;
  lastFile = file;
  error.hidden = retry.hidden = true;
  processingTime.textContent = '';
  if (file && file.size > 64 * 1024 * 1024) {
    error.textContent = 'This ZIP exceeds 64 MiB. Choose a smaller acquisition archive.';
    error.hidden = false;
    return;
  }
  busy = true;
  frame.inert = true;
  form.setAttribute('aria-busy', 'true');
  form.querySelectorAll('button,input,select').forEach(node => { node.disabled = true; });
  document.getElementById('loading').hidden = false;
  status.textContent = `Analyzing ${file ? file.name : 'the configured sample'}${document.getElementById('review').checked ? ' and checking six alternative settings' : ''}…`;
  const query = new URLSearchParams({output:'html', engine:document.getElementById('engine').value, review:String(document.getElementById('review').checked)});
  try {
    const response = await fetch(`${file ? '/v1/analyze' : '/v1/sample'}?${query}`, file ? {method:'POST',headers:{'Content-Type':'application/zip'},body:file} : {});
    if (!response.ok) {
      const payload = await response.json().catch(() => ({}));
      throw new Error(payload.error?.message || `Analysis failed (${response.status}). Please retry.`);
    }
    const html = await response.text();
    const nextUrl = URL.createObjectURL(new Blob([html], {type:'text/html'}));
    await new Promise(resolve => { frame.onload = resolve; frame.src = nextUrl; frame.hidden = false; });
    if (reportUrl) URL.revokeObjectURL(reportUrl);
    reportUrl = nextUrl;
    const duration = response.headers.get('Server-Timing')?.match(/processing;dur=([\d.]+)/)?.[1];
    if (duration) processingTime.textContent = `Processed in ${(Number(duration) / 1000).toFixed(2)} s`;
    status.textContent = `${file ? file.name : 'Configured sample'} · ${document.getElementById('engine').selectedOptions[0].text} · 10 components per page`;
  } catch (failure) {
    status.textContent = frame.hidden ? 'No result loaded.' : 'Previous result retained.';
    error.textContent = failure.message === 'Failed to fetch' ? 'Cannot reach the API. Check the connection and retry.' : failure.message;
    error.hidden = retry.hidden = false;
  } finally {
    document.getElementById('loading').hidden = true;
    form.querySelectorAll('button,input,select').forEach(node => { node.disabled = false; });
    form.setAttribute('aria-busy', 'false');
    frame.inert = false;
    busy = false;
  }
}
form.addEventListener('submit', event => {
  event.preventDefault();
  const file = document.getElementById('sample-file').files[0];
  if (file) load(file);
  else {
    error.textContent = sampleAvailable ? 'Choose a ZIP file first, or load the configured sample.' : 'Choose a ZIP file first.';
    error.hidden = false;
    document.getElementById('sample-file').focus();
  }
});
document.getElementById('load-sample').addEventListener('click', () => load());
retry.addEventListener('click', () => load(lastFile));
const sampleAvailable = __SAMPLE_AVAILABLE__;
document.getElementById('load-sample').hidden = !sampleAvailable;
if (sampleAvailable) load();
else {
  document.getElementById('loading').hidden = true;
  status.textContent = 'Choose a ZIP file to analyze.';
}
</script>
</html>
