[package]
name = "gcms-rust"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "_gcms_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["extension-module"], optional = true }
numpy = { version = "0.29.0", optional = true }
axum = { version = "0.8.9", optional = true }
deadpool-postgres = { version = "0.14.2", optional = true }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"], optional = true }
serde_json = { version = "1", features = ["float_roundtrip"], optional = true }
sha2 = { version = "0.10", optional = true }

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]
server = ["dep:axum", "dep:deadpool-postgres", "dep:tokio-postgres", "dep:tokio", "dep:serde_json", "dep:sha2"]

[[bin]]
name = "gcms-api"
path = "src/main.rs"
required-features = ["server"]

[profile.release]
codegen-units = 1
lto = "thin"
