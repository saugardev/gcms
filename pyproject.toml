[project]
name = "mafer-gcms"
version = "0.1.0"
description = "Reproducible GC-MS screening API and Python benchmark baseline"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2.1,<3",
  "pydantic>=2.10,<3",
  "rainbow-api>=1.5.2,<2",
  "scipy>=1.14,<2",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "ruff>=0.12,<1"]

[project.scripts]
gcms = "gcms.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services/python/gcms"]

[tool.hatch.build.targets.sdist]
only-include = ["services/README.md", "services/python", "services/rust/src", "services/rust/Cargo.toml", "services/rust/Cargo.lock", "services/rust/build.rs", "services/rust/schema.sql", "tests", "scripts", "deploy", ".github/workflows", "rust-toolchain.toml", "pyproject.toml", "uv.lock", ".python-version", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "docs", "examples"]
exclude = ["**/__pycache__", "**/.DS_Store", "examples/reproducibility.json"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["services/python"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
